<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="纹脉传统文化纹样资源库：查看完整纹样单元与连续铺陈版本。">
  <title>纹样资源库｜纹脉 LingWen</title>
  <style>
    :root{--paper:#f7f1e7;--card:#fffaf2;--ink:#2a211d;--muted:#74665e;--red:#9f2923;--red2:#7f1f1b;--gold:#d6a94e;--line:rgba(72,52,42,.15);--shadow:0 22px 60px rgba(61,43,33,.13)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);line-height:1.65}button,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}img{display:block;max-width:100%}.shell{width:min(1180px,calc(100% - 40px));margin:auto}
    header{position:sticky;top:0;z-index:20;background:rgba(247,241,231,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.seal{width:39px;height:39px;border-radius:13px;background:var(--red);color:#fff7ea;display:grid;place-items:center;font:22px STKaiti,KaiTi,serif}.back{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-weight:800}.back:hover{border-color:var(--red);color:var(--red)}
    .hero{padding:74px 0 40px;background:radial-gradient(circle at 80% 10%,rgba(214,169,78,.24),transparent 30%)}.kicker{color:var(--red);font-size:13px;font-weight:900;letter-spacing:.14em}.hero h1{font:700 clamp(42px,6vw,72px)/1.05 STSong,SimSun,serif;margin:16px 0}.hero p{font-size:18px;color:var(--muted);max-width:800px}.notice{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border:1px solid rgba(159,41,35,.22);background:rgba(255,250,242,.72);border-radius:18px;margin-top:26px}.notice b{color:var(--red);white-space:nowrap}.notice p{font-size:14px;margin:0}
    main{padding-bottom:80px}.searchbar{display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(145px,1fr));gap:10px;margin:26px 0 10px}.searchbar input,.searchbar select,.advanced select{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;color:var(--ink)}.advanced{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:12px 0 26px}.filter{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:999px;color:var(--ink);font-weight:800}.filter.active{background:var(--red);border-color:var(--red);color:#fff}.count{margin-left:auto;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 12px 34px rgba(61,43,33,.07)}.media{position:relative;aspect-ratio:1.22;background:#eee4d7;padding:18px}.media img{width:100%;height:100%;object-fit:contain;border-radius:16px;background:#f2eadf;cursor:zoom-in}.badge{position:absolute;top:30px;left:30px;background:rgba(42,33,29,.88);color:#fff;padding:6px 10px;border-radius:999px;font-size:12px}.fav{position:absolute;right:30px;top:30px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,250,242,.92);font-size:20px}.fav.active{background:var(--red);color:#fff}.body{padding:24px}.title-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.code{font-size:12px;letter-spacing:.12em;color:var(--red);font-weight:900}.card h2{font:700 30px STSong,SimSun,serif;margin:7px 0}.english{color:var(--muted);font-size:13px}.status{font-size:12px;border:1px solid rgba(159,41,35,.28);color:var(--red);padding:6px 10px;border-radius:999px;white-space:nowrap}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0}.meta div{padding:12px;background:#f5ecdf;border-radius:13px}.meta span{display:block;font-size:11px;color:var(--muted)}.meta b{font-size:13px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.switch,.download,.detail,.copy{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 13px;font-weight:800;font-size:13px}.switch.active{background:var(--ink);color:#fff;border-color:var(--ink)}.download{color:var(--red);border-color:rgba(159,41,35,.3)}.detail{margin-left:auto}
    dialog{border:0;padding:0;background:transparent;max-width:min(92vw,980px);max-height:92vh}dialog::backdrop{background:rgba(20,15,13,.82)}.lightbox,.passport{position:relative;background:#f3eadf;padding:18px;border-radius:22px}.lightbox img{max-height:84vh;max-width:88vw;object-fit:contain}.close{position:absolute;right:28px;top:28px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(42,33,29,.86);color:#fff;font-size:24px}.passport{padding:34px;width:min(88vw,760px);max-height:86vh;overflow:auto}.passport h2{font:700 34px STSong,SimSun,serif;margin:0 55px 4px 0}.passport-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.passport-grid div{padding:13px;background:#fffaf2;border-radius:12px}.passport-grid span{display:block;color:var(--muted);font-size:12px}.passport-grid b{font-size:14px}.prompt{margin-top:12px;padding:15px;background:#2a211d;color:#fff;border-radius:12px;font-size:13px}
    .empty{grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:34px 0}.pager button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:800}.pager button:disabled{opacity:.38;cursor:not-allowed}.format-select{flex:1;min-width:160px;border:1px solid var(--line);background:#fffaf2;border-radius:999px;padding:9px 12px;font-size:13px}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;max-width:720px}.evidence div{padding:14px 16px;border:1px solid var(--line);background:rgba(255,250,242,.74);border-radius:15px}.evidence b{display:block;font-size:24px;color:var(--red)}.evidence span{font-size:12px;color:var(--muted)}
    @media(max-width:780px){.grid,.searchbar,.advanced{grid-template-columns:1fr}.shell{width:min(100% - 28px,1180px)}.hero{padding-top:48px}.notice{display:block}.notice b{display:block;margin-bottom:6px}.count{width:100%;margin-left:0}.meta,.passport-grid,.evidence{grid-template-columns:1fr}.detail{margin-left:0}}
  </style>
</head>
<body>
  <header><nav class="shell"><a class="brand" href="index.html"><span class="seal">纹</span><span>纹脉 LingWen</span></a><a class="back" href="index.html#archive">← 返回首页</a></nav></header>
  <section class="hero"><div class="shell"><span class="kicker">PATTERN LIBRARY · CULTURAL PASSPORT</span><h1>传统文化纹样资源库</h1><p>从明确文化来源中提取造型、对称、重复、线条、色彩与寓意规则，再形成十种标准版式。所有生成内容默认标注为“概念生成”，来源核验和商用权利核验分别管理。</p><div class="evidence"><div><b id="family-total">—</b><span>纹样家族</span></div><div><b id="asset-total">—</b><span>独立版式文件</span></div><div><b id="theme-total">—</b><span>一级文化主题</span></div></div><div class="notice"><b>连续纹边缘为何被切开？</b><p>这是无缝连续纹样的结构要求：画面右侧会与下一块左侧衔接，上下同理。通过卡片的版式菜单可切换完整单元、团花、边框、包装等十种文件。</p></div></div></section>
  <main class="shell"><div class="searchbar"><input id="search" type="search" placeholder="搜索名称、编号、来源、寓意或产品…" aria-label="搜索纹样"><select id="status-filter" aria-label="按状态筛选"><option value="全部">全部状态</option><option value="概念生成">概念生成</option><option value="来源已核验">来源已核验</option><option value="商用已核验">商用已核验</option><option value="收藏">我的收藏</option></select><select id="period-filter" aria-label="按时期筛选"><option value="全部">全部时期</option></select><select id="source-filter" aria-label="按来源筛选"><option value="全部">全部来源</option></select></div><div class="advanced"><select id="meaning-filter" aria-label="按寓意筛选"><option value="全部">全部寓意</option></select><select id="color-filter" aria-label="按颜色筛选"><option value="全部">全部颜色</option></select><select id="product-filter" aria-label="按产品筛选"><option value="全部">全部产品</option></select><select id="format-filter" aria-label="按版式筛选"><option value="全部">全部版式</option></select></div><div class="toolbar" id="filters" aria-label="按一级主题筛选"><span class="count" id="count">正在载入资源…</span></div><div class="grid" id="grid"></div><div class="pager"><button id="prev-page">上一页</button><span id="page-label">1 / 1</span><button id="next-page">下一页</button></div></main>
  <dialog id="viewer"><div class="lightbox"><button class="close" aria-label="关闭大图">×</button><img id="viewer-image" alt="纹样大图"></div></dialog>
  <dialog id="passport"><div class="passport"><button class="close" aria-label="关闭文化身份证">×</button><div id="passport-content"></div></div></dialog>
  <script>
    const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer'),viewerImage=document.querySelector('#viewer-image'),passport=document.querySelector('#passport'),passportContent=document.querySelector('#passport-content'),search=document.querySelector('#search'),statusFilter=document.querySelector('#status-filter'),periodFilter=document.querySelector('#period-filter'),sourceFilter=document.querySelector('#source-filter'),meaningFilter=document.querySelector('#meaning-filter'),colorFilter=document.querySelector('#color-filter'),productFilter=document.querySelector('#product-filter'),formatFilter=document.querySelector('#format-filter'),filters=document.querySelector('#filters'),prevPage=document.querySelector('#prev-page'),nextPage=document.querySelector('#next-page'),pageLabel=document.querySelector('#page-label');let count=document.querySelector('#count'),items=[],activeTheme='全部',page=1;const pageSize=24;const favorites=new Set(JSON.parse(localStorage.getItem('lingwen-favorites')||'[]'));
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const list=v=>Array.isArray(v)?v:[];const value=(v,fallback='待补充')=>v||fallback;
    function filtered(){const q=search.value.trim().toLowerCase(),state=statusFilter.value;return items.filter(x=>(activeTheme==='全部'||x.primaryTheme===activeTheme)&&(state==='全部'||(state==='收藏'?favorites.has(x.id):x.status===state))&&(periodFilter.value==='全部'||x.period===periodFilter.value)&&(sourceFilter.value==='全部'||x.source===sourceFilter.value)&&(meaningFilter.value==='全部'||list(x.meaning).includes(meaningFilter.value))&&(colorFilter.value==='全部'||list(x.colors).includes(colorFilter.value))&&(productFilter.value==='全部'||list(x.uses).includes(productFilter.value))&&(formatFilter.value==='全部'||Object.hasOwn(x.assets||{},formatFilter.value))&&(!q||[x.id,x.name,x.englishName,x.primaryTheme,x.series,x.source,x.period,...list(x.meaning),...list(x.uses),...list(x.colors)].join(' ').toLowerCase().includes(q)))}
    function render(){const shown=filtered(),pages=Math.max(1,Math.ceil(shown.length/pageSize));page=Math.min(page,pages);const current=shown.slice((page-1)*pageSize,page*pageSize);count.textContent=`检索到 ${shown.length} / ${items.length} 个家族`;pageLabel.textContent=`${page} / ${pages}`;prevPage.disabled=page<=1;nextPage.disabled=page>=pages;grid.innerHTML=current.map(x=>{const entries=Object.entries(x.assets||{}),first=entries.find(([k])=>k==='圆形团花版')||entries[0]||['完整单元',x.image];return `<article class="card" data-id="${esc(x.id)}"><div class="media"><img src="${esc(first[1])}" alt="${esc(x.name)}${esc(first[0])}" data-view><span class="badge">${esc(first[0])}</span><button class="fav ${favorites.has(x.id)?'active':''}" data-fav aria-label="收藏${esc(x.name)}">${favorites.has(x.id)?'★':'☆'}</button></div><div class="body"><div class="title-row"><div><span class="code">${esc(x.id)} · ${esc(x.primaryTheme)}</span><h2>${esc(x.name)}</h2><div class="english">${esc(value(x.englishName,''))}</div></div><span class="status">${esc(x.status)}</span></div><div class="meta"><div><span>文化来源</span><b>${esc(x.source)}</b></div><div><span>历史时期 / 完成度</span><b>${esc(value(x.period,'待考证'))} · ${esc(value(x.familyCompletion,'待补'))}</b></div></div><div class="chips">${list(x.meaning).map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div><div class="actions"><select class="format-select" data-format aria-label="切换${esc(x.name)}版式">${entries.map(([label,src])=>`<option value="${esc(src)}">${esc(label)}</option>`).join('')}</select><button class="detail" data-detail>文化身份证</button><a class="download" href="${esc(first[1])}" download>下载</a></div></div></article>`}).join('')||'<p class="empty">没有符合条件的资源。</p>'}
    function openPassport(x){passportContent.innerHTML=`<span class="code">${esc(x.id)} · ${esc(x.series)}</span><h2>${esc(x.name)}</h2><div class="english">${esc(value(x.englishName,''))}</div><div class="passport-grid"><div><span>文化来源</span><b>${esc(x.source)}</b></div><div><span>历史时期</span><b>${esc(value(x.period))}</b></div><div><span>原始母题</span><b>${esc(value(x.prototype,x.source))}</b></div><div><span>象征寓意</span><b>${list(x.meaning).map(esc).join(' · ')}</b></div><div><span>构图特征</span><b>${esc(value(x.composition))}</b></div><div><span>推荐配色</span><b>${list(x.colors).length?list(x.colors).map(esc).join(' · '):'待补充'}</b></div><div><span>适用产品</span><b>${list(x.uses).map(esc).join(' · ')}</b></div><div><span>推荐市场</span><b>${list(x.markets).length?list(x.markets).map(esc).join(' · '):'待评估'}</b></div><div><span>使用禁忌</span><b>${list(x.taboos).length?list(x.taboos).map(esc).join('；'):'待文化复核'}</b></div><div><span>来源可信度</span><b>${esc(value(x.confidence,'待核验'))}</b></div><div><span>生成状态</span><b>${esc(x.status)}</b></div><div><span>权利与商用状态</span><b>${esc(value(x.rightsStatus,'待来源与商用权利复核'))}</b></div></div><div class="prompt"><b>生成提示词</b><br>${esc(value(x.prompt,'待补录'))}</div><button class="copy" data-copy style="margin-top:12px">复制生成提示词</button>`;passport.showModal();passportContent.querySelector('[data-copy]').addEventListener('click',async e=>{await navigator.clipboard.writeText(value(x.prompt,''));e.target.textContent='已复制'})}
    grid.addEventListener('click',e=>{const card=e.target.closest('.card');if(!card)return;const item=items.find(x=>x.id===card.dataset.id);if(e.target.matches('[data-fav]')){favorites.has(item.id)?favorites.delete(item.id):favorites.add(item.id);localStorage.setItem('lingwen-favorites',JSON.stringify([...favorites]));render();return}if(e.target.matches('[data-detail]'))openPassport(item);if(e.target.matches('[data-view]')){viewerImage.src=e.target.src;viewerImage.alt=e.target.alt;viewer.showModal()}});
    grid.addEventListener('change',e=>{if(!e.target.matches('[data-format]'))return;const card=e.target.closest('.card'),label=e.target.options[e.target.selectedIndex].text;card.querySelector('.media img').src=e.target.value;card.querySelector('.badge').textContent=label;card.querySelector('.download').href=e.target.value});
    filters.addEventListener('click',e=>{if(!e.target.matches('.filter'))return;activeTheme=e.target.dataset.theme;page=1;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===e.target));render()});[search,statusFilter,periodFilter,sourceFilter,meaningFilter,colorFilter,productFilter,formatFilter].forEach(el=>el.addEventListener(el===search?'input':'change',()=>{page=1;render()}));prevPage.addEventListener('click',()=>{page--;render();scrollTo({top:grid.offsetTop-100,behavior:'smooth'})});nextPage.addEventListener('click',()=>{page++;render();scrollTo({top:grid.offsetTop-100,behavior:'smooth'})});
    viewer.querySelector('.close').addEventListener('click',()=>viewer.close());passport.querySelector('.close').addEventListener('click',()=>passport.close());[viewer,passport].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
    const fillSelect=(el,values,label)=>{el.innerHTML=`<option value="全部">全部${label}</option>`+[...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'zh-CN')).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')};
    fetch('pattern-library.json').then(r=>{if(!r.ok)throw Error('资源数据载入失败');return r.json()}).then(data=>{items=data.items;const themes=['全部',...data.primaryThemes];filters.innerHTML=themes.map((s,i)=>`<button class="filter ${i?'':'active'}" data-theme="${esc(s)}">${esc(s)}</button>`).join('')+'<span class="count" id="count"></span>';count=document.querySelector('#count');fillSelect(periodFilter,items.map(x=>x.period),'时期');fillSelect(sourceFilter,items.map(x=>x.source),'来源');fillSelect(meaningFilter,items.flatMap(x=>list(x.meaning)),'寓意');fillSelect(colorFilter,items.flatMap(x=>list(x.colors)),'颜色');fillSelect(productFilter,items.flatMap(x=>list(x.uses)),'产品');fillSelect(formatFilter,data.familyFormats,'版式');document.querySelector('#family-total').textContent=data.evidence.familyCount.toLocaleString();document.querySelector('#asset-total').textContent=data.evidence.assetCount.toLocaleString();document.querySelector('#theme-total').textContent=data.evidence.primaryThemeCount;render()}).catch(()=>{count.textContent='资源载入失败';grid.innerHTML='<p class="empty">暂时无法读取资源数据，请刷新页面重试。</p>'});
  </script>
</body>
</html>
